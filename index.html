<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>황미란 Hwang Miran</title>
<meta name="description" content="황미란. 미술·디자인 교사, 디자이너, 연구자. 가르친 것, 만든 것, 쓴 것, 강의한 것, 연구한 것의 기록.">
<meta name="author" content="황미란 Hwang Miran">
<meta property="og:title" content="황미란 Hwang Miran">
<meta property="og:description" content="미술과 디자인을 가르치고, 수업 도구를 만들고, 그 수업을 연구합니다.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111114'/%3E%3Cpath d='M0 21.3h64M0 42.6h64M21.3 0v64M42.6 0v64' stroke='%23fff' stroke-width='1'/%3E%3Crect x='21.3' y='21.3' width='21.3' height='21.3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="overlay" id="overlay" hidden aria-hidden="true"><div class="grid"></div></div>

<header class="top">
  <div class="wrap grid">
    <a class="who" href="#top">황미란 <span class="label">Hwang Miran</span></a>
    <nav id="nav" aria-label="구역"></nav>
    <div class="tools">
      <button class="pill lang" id="lang-btn" type="button"></button>
      <button class="pill grid-btn" id="grid-btn" type="button" aria-pressed="false" title="12단 그리드 보기 (G)">Grid</button>
      <button class="pill" id="theme-btn" type="button">Dark</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero wrap" aria-label="소개">
    <div class="mega-box"><h1 class="mega" id="mega">Hwang Miran</h1></div>
    <div class="intro grid">
      <p class="lead" id="lead"></p>
      <div class="intro-side">
        <p class="body" id="intro-body"></p>
        <dl class="now" id="now"></dl>
      </div>
    </div>
  </section>

  <section class="sec wrap" id="works">
    <div class="sec-head grid">
      <span class="idx label">Selected Works</span>
      <h2>선별 작업</h2>
      <p>수업 설계, 정보 디자인, 교과서, 작품 가운데 열한 가지. 각 작업은 하나의 질문에서 시작했습니다.</p>
    </div>
    <div class="projects" id="projects"></div>
  </section>

  <div id="chapters"></div>

  <section class="sec wrap" id="images">
    <div class="sec-head grid">
      <span class="idx label">Images</span>
      <h2>이미지</h2>
      <p>선별 작업에 없는 사진만 실었습니다. 평소에는 흑백이고, 마우스를 올리거나 손가락을 대면 원래 색이 나옵니다. 학생 얼굴과 이름이 드러난 사진은 싣지 않았습니다.</p>
    </div>
    <div class="gallery" id="gallery-grid"></div>
  </section>
</main>

<footer class="foot wrap" id="contact">
  <div class="grid">
    <span class="label" style="grid-column:1/-1">Contact</span>
    <p class="big"><button class="copy" type="button" data-email title="눌러서 주소 복사"></button></p>
    <div class="c1"><span class="label">Elsewhere</span><br><a class="ul" id="gh" href="https://github.com/miran-artcode" target="_blank" rel="noopener">GitHub ↗</a></div>
    <div class="c2"><span class="label">Based in</span><br>Seoul, Korea · <span class="clock" id="clock"></span></div>
    <div class="c3"><span class="label">Updated</span><br><span id="updated"></span></div>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script src="js/data.js"></script>
<script src="js/qr.js"></script>
<script src="js/main.js"></script>
</body>
</html>
